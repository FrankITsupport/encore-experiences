name: Build and deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venuebox-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.CPANEL_DEPLOY_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: dist/
      - name: Deploy and migrate
        run: bash scripts/deploy-cpanel.sh
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST }}
          CPANEL_USER: ${{ vars.CPANEL_USER }}
          CPANEL_PORT: ${{ vars.CPANEL_PORT }}
          CPANEL_DEPLOY_PATH: ${{ vars.CPANEL_DEPLOY_PATH }}
          CPANEL_SITE_URL: ${{ vars.CPANEL_SITE_URL }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
